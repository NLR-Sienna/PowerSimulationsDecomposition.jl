name: Documentation

on:
  push:
    branches:
      - main
      - 'release-*'
    tags: '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate(); Pkg.status()'
      - name: Build documentation and execute tutorial
        run: julia --project=docs --color=yes docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build
      - name: Deploy versioned documentation
        if: >-
          vars.DOCS_DEPLOY == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCS_DEPLOY: 'true'
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          if [ -z "$DOCUMENTER_KEY" ]; then
            echo "::error::DOCS_DEPLOY is enabled but the DOCUMENTER_KEY secret is missing."
            exit 1
          fi
          julia --project=docs --color=yes docs/make.jl
